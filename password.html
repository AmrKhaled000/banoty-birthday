<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Made For Banoty</title>
<link rel="icon" href="image/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  .lock {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 28px;
    box-sizing: border-box;
    text-align: center;
    background: radial-gradient(circle at 50% 45%, #170711 0%, #0a0409 45%, #000 100%);
  }

  .lock__glow {
    position: absolute;
    width: min(140vw, 760px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 105, 180, .22) 0%, rgba(255, 20, 147, .08) 42%, transparent 68%);
    filter: blur(28px);
    animation: pulse 7s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.15); }
  }

  .lock__box {
    position: relative;
    z-index: 1;
    width: min(100%, 370px);
    padding: 40px 30px 28px;
    border-radius: 20px;
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 105, 180, .22);
    box-shadow: 0 24px 60px -24px rgba(255, 20, 147, .45), inset 0 1px 0 rgba(255, 255, 255, .07);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  .lock__icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 18px;
    display: block;
    color: #ff69b4;
    filter: drop-shadow(0 0 16px rgba(255, 20, 147, .7));
  }

  .lock__title {
    margin: 0 0 8px;
    font-family: 'Pacifico', 'Dancing Script', cursive;
    font-size: clamp(24px, 7vw, 32px);
    font-weight: 400;
    background: linear-gradient(45deg, #ff69b4, #ff97b4, #ff1493, #ff69b4);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shift 8s ease-in-out infinite;
  }

  @keyframes shift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .lock__sub {
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255, 255, 255, .55);
  }

  .lock__row {
    display: flex;
    gap: 8px;
  }

  .lock__input {
    flex: 1 1 auto;
    min-width: 0;
    height: 50px;
    padding: 0 16px;
    font-family: Arial, sans-serif;
    font-size: 17px;
    letter-spacing: .3em;
    color: #fff;
    background: rgba(0, 0, 0, .55);
    border: 1px solid rgba(255, 105, 180, .3);
    border-radius: 14px;
    outline: none;
    transition: border-color .3s, box-shadow .3s, background .3s;
  }

  .lock__input::placeholder { color: rgba(255, 255, 255, .2); }

  .lock__input:focus {
    border-color: rgba(255, 105, 180, .75);
    background: rgba(0, 0, 0, .75);
    box-shadow: 0 0 0 4px rgba(255, 105, 180, .14);
  }

  .lock__btn {
    flex: 0 0 auto;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2c1810;
    background: linear-gradient(135deg, #ff5a8c, #ff97b4);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .2s, filter .2s;
  }

  .lock__btn svg { width: 20px; height: 20px; }
  .lock__btn:hover  { filter: brightness(1.08); transform: translateY(-1px); }
  .lock__btn:active { transform: scale(.95); }

  .lock__error {
    min-height: 20px;
    margin: 12px 0 0;
    font-size: 13px;
    color: #ff6b9d;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .3s, transform .3s;
  }

  .lock__error.is-shown { opacity: 1; transform: translateY(0); }

  .lock.is-wrong .lock__box { animation: shake .5s cubic-bezier(.36, .07, .19, .97); }
  .lock.is-wrong .lock__input {
    border-color: rgba(255, 107, 157, .8);
    box-shadow: 0 0 0 4px rgba(255, 20, 147, .16);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }

  .lock.is-open {
    animation: fadeOut .5s ease forwards;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: scale(1.06); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock__glow" aria-hidden="true"></div>

  <form class="lock__box" id="form" autocomplete="off" novalidate>
    <svg class="lock__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
      <path d="M8 10.5V7.5a4 4 0 1 1 8 0v3"/>
      <circle cx="12" cy="15.7" r="1.4" fill="currentColor" stroke="none"/>
    </svg>

    <h1 class="lock__title">Made For Banoty</h1>
    <p class="lock__sub">This page is locked. Enter the password to open it.</p>

    <div class="lock__row">
      <input
        class="lock__input"
        id="input"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="off"
        spellcheck="false"
        maxlength="12"
        placeholder="• • • • • • •"
        aria-label="Password"
        aria-describedby="error">
      <button class="lock__btn" type="submit" aria-label="Unlock">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <p class="lock__error" id="error" role="alert" aria-live="polite"></p>
  </form>
</div>

<script>
(function () {
  'use strict';

  var PASSWORD = '910147';
  var KEY = 'banoty.birthday.unlocked';

  var lock = document.getElementById('lock');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var error = document.getElementById('error');
  var timer = null;

  function open_() {
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    lock.classList.add('is-open');
    window.setTimeout(function () {
      window.location.replace('index.html');
    }, 480);
  }

  function digits(v) {
    return String(v).replace(/\D+/g, '');
  }

  function wrong() {
    window.clearTimeout(timer);
    lock.classList.remove('is-wrong');
    void lock.offsetWidth;
    lock.classList.add('is-wrong');
    error.textContent = 'Wrong password. Try again.';
    error.classList.add('is-shown');
    input.setAttribute('aria-invalid', 'true');
    input.select();
    timer = window.setTimeout(function () {
      lock.classList.remove('is-wrong');
    }, 600);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (digits(input.value) === PASSWORD) {
      error.textContent = 'Unlocking\u2026';
      error.classList.add('is-shown');
      input.removeAttribute('aria-invalid');
      open_();
    } else {
      wrong();
    }
  });

  input.addEventListener('input', function () {
    if (error.textContent !== 'Unlocking\u2026') {
      error.classList.remove('is-shown');
      input.removeAttribute('aria-invalid');
    }
    input.value = digits(input.value);
  });

  window.setTimeout(function () {
    try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
  }, 150);
})();
</script>
</body>
</html>
